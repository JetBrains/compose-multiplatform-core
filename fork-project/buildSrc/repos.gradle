import groovy.transform.Field

@Field
File reposSupportRootFolder
@Field
String useSourcesInsteadOfAospArtifactsProperty =
        "jetbrains.androidx.use.sources.instead.of.aosp.artifacts"

def supportRootFolder = ext.supportRootFolder
if (supportRootFolder == null) {
    throw new RuntimeException("Canonical root project directory is not set. You must specify " +
            "ext.supportRootFolder before including this script")
}
reposSupportRootFolder = supportRootFolder
// Makes strong assumptions about the project structure.
def checkoutRoot = supportRootFolder.parentFile.parentFile

ext.repos = new Properties()
ext.repos.checkoutRoot = checkoutRoot.absolutePath
ext.repos.prebuiltsRoot = new File(checkoutRoot, "prebuilts").absolutePath

def findGradlePropertyInFiles(String propertyName) {
    def dir = buildscript.sourceFile.parentFile
    while (dir != null) {
        def propertiesFile = new File(dir, "gradle.properties")
        if (propertiesFile.isFile()) {
            def properties = new Properties()
            propertiesFile.withInputStream { properties.load(it) }
            def value = properties.getProperty(propertyName)
            if (value != null) return value
        }
        dir = dir.parentFile
    }
    return null
}

def isUseSourcesInsteadOfAospArtifactsEnabled() {
    def value = gradle.startParameter.projectProperties[useSourcesInsteadOfAospArtifactsProperty]
            ?: System.getProperty(useSourcesInsteadOfAospArtifactsProperty)
            ?: findGradlePropertyInFiles(useSourcesInsteadOfAospArtifactsProperty)
    return value?.toBoolean() ?: false
}

def getSourcesInsteadOfAospArtifactsRepositoryDir() {
    def outDir = System.getenv("OUT_DIR")
    if (outDir != null) {
        return new File(outDir, "repository")
    }
    return new File(reposSupportRootFolder, "out/repository")
}

/**
 * Adds maven repositories to the given repository handler.
 */
def addMavenRepositories(RepositoryHandler handler) {
    def metalavaRepoOverride = System.getenv("METALAVA_REPO")
    if (metalavaRepoOverride != null) {
        for(extraRepo in metalavaRepoOverride.split(File.pathSeparator)) {
            handler.maven {
                url = extraRepo
            }
        }
    }
    if (isUseSourcesInsteadOfAospArtifactsEnabled()) {
        handler.maven {
            name = "mavenRepo"
            url = getSourcesInsteadOfAospArtifactsRepositoryDir()
            content {
                includeGroup("androidx.compose.runtime")
            }
        }
    }
    /*
    handler.maven {
        url = "${repos.prebuiltsRoot}/androidx/internal"
        metadataSources {
            mavenPom()
            artifact()
        }
        content {
            includeGroupByRegex "android.*"
            includeGroupByRegex "com.android.support.*"
            excludeGroupByRegex "androidx.databinding.*"
        }
    }
    handler.maven {
        url = "${repos.prebuiltsRoot}/androidx/external"
        metadataSources {
            mavenPom()
            artifact()
        }
        if (metalavaRepoOverride != null) {
            // When using custom metalava repo, do not resolve metalava artifacts from this repo
            content {
                excludeGroup "com.android.tools.metalava"
            }
        }
    }
    */
    if (true /* In JetBrains Fork */) {
        handler.mavenCentral()
        handler.google {
            content {
                includeGroupByRegex("androidx.*")
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
            }
        }
        handler.gradlePluginPortal()
        handler.maven {
            url = "https://packages.jetbrains.team/maven/p/cmp/dev"
        }
        handler.maven {
            url = "https://packages.jetbrains.team/maven/p/kt/dev"
            content {
                includeGroupByRegex("org\\.jetbrains\\.kotlin.*")
            }
        }
        handler.maven {
            url = "https://central.sonatype.com/repository/maven-snapshots"
        }
        handler.mavenLocal()
    }
    // Ordering appears to be important: b/229733266
    def androidPluginRepoOverride = System.getenv("GRADLE_PLUGIN_REPO")
    if (androidPluginRepoOverride != null) {
        for(extraRepo in androidPluginRepoOverride.split(File.pathSeparator)) {
            handler.maven {
                url = extraRepo
            }
        }
    }
}

ext.repos.addMavenRepositories = this.&addMavenRepositories
