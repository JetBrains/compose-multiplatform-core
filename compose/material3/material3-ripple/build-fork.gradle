import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    redirect("androidx.compose.material3") {
        androidLibrary {
            compileSdk = 35
            namespace = "org.jetbrains.androidx.compose.material3.ripple"
        }
    }
    desktop()
    mac()
    ios()
    js()
    wasmJs()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain.dependencies {
            api(project(":compose:foundation:foundation"))
            api(project(":compose:runtime:runtime"))

            implementation("androidx.collection:collection:1.5.0")
            implementation(project(":compose:animation:animation"))
            implementation(project(":compose:ui:ui-util"))
        }

        nonAndroidMain.dependsOn(commonMain)
        nonAndroidTest.dependsOn(commonTest)
        desktopMain.dependsOn(nonAndroidMain)
        desktopTest.dependsOn(nonAndroidTest)
        nonJvmMain.dependsOn(nonAndroidMain)
        nonJvmTest.dependsOn(nonAndroidTest)
    }
}

androidx {
    name = "Compose Material3 Ripple"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS

    inceptionYear = "2026"
    description = "Building block APIs to build ripples that follow a Material 3 specification."
}

