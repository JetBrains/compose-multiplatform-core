import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    redirect("androidx.compose.ui") {
        androidLibrary {
            namespace = "org.jetbrains.androidx.compose.ui.tooling.recomposition"

            compileSdk = 35
        }
    }
    desktop()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain.dependencies {
            api(project(":compose:runtime:runtime"))
            api(project(":compose:ui:ui"))
        }

        desktopMain.dependencies {
            implementation(project(":compose:foundation:foundation"))
            implementation(project(":compose:foundation:foundation-layout"))
            implementation(libs.kotlinCoroutinesCore)
        }

        desktopTest.dependencies {
            implementation(libs.kotlinTest)
            implementation(libs.kotlinCoroutinesTest)
            implementation(libs.skikoAwtRuntime)
        }
    }
}

tasks.matching { it.name == "desktopTest" }.configureEach {
    systemProperty("java.awt.headless", "true")
    jvmArgs("--enable-native-access=ALL-UNNAMED")
    // HeadlessApplication is a process-wide singleton that flips global Compose flags; keep each
    // test class in its own JVM so the plain recorder tests are not affected by it.
    forkEvery = 1
}

androidx {
    name = "Compose Recomposition Inspector"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2026"
    description = "Runtime inspector for desktop Compose that records which recompose scopes " +
            "run, what invalidated them, and flags recomposition loops and unnecessary recompositions."
    legacyDisableKotlinStrictApiMode = true
}
