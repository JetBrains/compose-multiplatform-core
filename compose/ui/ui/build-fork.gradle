// TEMPORARY (remove me): each of these asserts on behavior the current fork API has no equivalent
// for, which needs a redesign or a deliberate deletion decision:
// - WindowStateTest.kt asserts two-way WindowState binding that the one-shot
//   initialSize/initialPosition API can't provide.
// - PointerTest.kt's `customPointerChanges` test builds custom cursors via
//   `PointerIcon(cursor: java.awt.Cursor)`, which was removed with no replacement.
// Every other desktopTest file compiles.
tasks.named("compileTestKotlinDesktop").configure {
    exclude { it.file.name == "WindowStateTest.kt" }
    exclude { it.file.name == "PointerTest.kt" }
}

tasks.register("desktopHeadlessTest", Test) {
    group = "verification"
    description = "Headless desktop tests"
    testClassesDirs = sourceSets.desktopTest.output.classesDirs
    classpath = sourceSets.desktopTest.runtimeClasspath

    useJUnit {
        includeCategories("androidx.compose.ui.HeadlessTest")
    }
    // One fresh JVM per test class: HeadlessApplication is a process-wide singleton and
    // stopAndJoin() poisons it permanently (HeadlessShutdownContractTest exercises exactly
    // that), so a class that shuts it down must never share a JVM with later classes.
    forkEvery = 1
    systemProperty("java.awt.headless", "true")
    // Skiko's native library is loaded via System.load; on JDK 24+ restricted native access is
    // enforced, so enable it here as the sibling desktopTest task already does.
    jvmArgs("--enable-native-access=ALL-UNNAMED")
}

tasks.desktopTest {
    useJUnit {
        excludeCategories("androidx.compose.ui.HeadlessTest")
    }
    jvmArgs("--add-opens=java.desktop/javax.swing=ALL-UNNAMED")
}

