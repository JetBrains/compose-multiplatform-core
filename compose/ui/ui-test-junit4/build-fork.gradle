import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
    alias(libs.plugins.atomicFu)
}

androidXMultiplatform {
    redirect("androidx.compose.ui") {
        androidLibrary {
            compileSdk = 35
            namespace = "org.jetbrains.androidx.compose.ui.test.junit4"

        }
    }
    desktop()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain.dependencies {
            api(project(":compose:ui:ui-test"))
            implementation("androidx.annotation:annotation:1.9.1")
            implementation(libs.kotlinCoroutinesCore)
            implementation(libs.kotlinCoroutinesTest)
        }

        commonTest.dependencies {
            implementation(libs.kotlinTest)
        }

        jvmAndAndroidMain.dependencies {
            api(libs.junit)
        }

        // TODO: Align naming: nonAndroidMain
        skikoMain {
            dependsOn(commonMain)
        }

        // TODO: It seems it might be combined with desktopTest
        skikoTest {
            dependsOn(commonTest)
            dependencies {
                implementation(project(":compose:material:material"))
                implementation(project(":compose:foundation:foundation"))
                implementation(libs.skiko)
                implementation(libs.atomicFu)
            }
        }

        desktopMain {
            dependsOn(skikoMain)
            dependencies {
                implementation(libs.truth)
                implementation(libs.skiko)
                implementation(project(":compose:ui:ui-skiko"))
            }
        }

        desktopTest {
            dependsOn(skikoTest)
            dependencies {
                implementation(libs.truth)
                implementation(libs.junit)
                implementation(libs.skikoAwtRuntime)
            }
        }
    }
}

androidx {
    name = "Compose Testing for JUnit4"
    type = SoftwareType.PUBLISHED_KOTLIN_ONLY_TEST_LIBRARY
    inceptionYear = "2020"
    description = "Compose testing integration with JUnit4"
    legacyDisableKotlinStrictApiMode = true
    enableRobolectric()
}
