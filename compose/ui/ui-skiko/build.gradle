import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    androidLibrary {
        compileSdk = 35
        namespace = "androidx.compose.ui.skiko"
    }
    desktop()
    mac()
    ios()
    js()
    wasmJs()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain.dependencies {
            api(project(":compose:ui:ui-graphics"))
            api(project(":compose:ui:ui-text"))
            implementation(project(":compose:runtime:runtime"))
            implementation(project(":compose:ui:ui-util"))
        }

        commonTest.dependencies {
            implementation(libs.kotlinTest)
        }

        nonAndroidMain {
            dependsOn(commonMain)
            dependencies {
                implementation(libs.atomicFu)
                api(libs.skiko)
            }
        }

        nonAndroidTest {
            dependsOn(commonTest)
            dependencies {
                implementation(project(":kruth:kruth"))
                implementation(project(":compose:ui:ui-test"))
            }
        }

        nonAndroidExcludingWebMain {
            dependsOn(nonAndroidMain)
        }

        desktopMain {
            dependsOn(nonAndroidMain)
            dependsOn(nonAndroidExcludingWebMain)
            dependencies {
                runtimeOnly(libs.skikoAwtRuntime)
            }
        }

        desktopTest {
            dependsOn(nonAndroidTest)
            dependencies {
                implementation(libs.skikoAwtRuntime)
                implementation(libs.junit)
                implementation(libs.truth)
                implementation(project(":internal-testutils-fonts"))
                implementation(project(":compose:foundation:foundation"))
                implementation(project(":compose:ui:ui-test-junit4"))
            }
        }

        nonJvmMain {
            dependsOn(nonAndroidMain)
        }

        nonJvmTest {
            dependsOn(nonAndroidTest)
        }

        nativeMain {
            dependsOn(nonJvmMain)
            dependsOn(nonAndroidExcludingWebMain)
        }

        nativeTest {
            dependsOn(nonJvmTest)
        }
    }
}

androidx {
    name = "Compose UI Skiko"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2026"
    description = "Skiko-backed runtime implementations for Compose UI"
    legacyDisableKotlinStrictApiMode = true
}
