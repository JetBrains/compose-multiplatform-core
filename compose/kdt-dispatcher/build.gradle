import androidx.build.SoftwareType

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    // Desktop/JVM-only: this integration bridges kotlinx.coroutines Dispatchers.Main
    // to the Compose UI dispatcher for the kotlin-desktop-toolkit backend.
    jvm()

    sourceSets {
        jvmMain.dependencies {
            // Provides androidx.compose.ui.ComposeUIDispatcher.
            implementation(project(":compose:ui:ui"))
            implementation(libs.kotlinCoroutinesCore)
        }
    }
}

androidx {
    name = "Compose KDT Dispatcher"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2026"
    description = "Provides a kotlinx.coroutines Main dispatcher backed by the Compose UI " +
            "dispatcher for the kotlin-desktop-toolkit backend."
}
