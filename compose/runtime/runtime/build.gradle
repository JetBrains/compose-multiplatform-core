import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier
import com.android.build.api.dsl.KotlinMultiplatformAndroidHostTestCompilation

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    // DataSource prototype: only the Android target is redirected. Every other target is built from
    // source, because this module carries the DataSource API and the runtime changes it needs
    // (Composition, Recomposer, Snapshot, SnapshotStateObserver, DerivedState). A redirected target
    // publishes an empty artifact that merely depends on AOSP's androidx.compose.runtime, so none of
    // that would ship.
    redirect("androidx.compose.runtime") {
        androidLibrary {
            namespace = "org.jetbrains.compose.runtime"
            compilations.withType(KotlinMultiplatformAndroidHostTestCompilation) {
                it.returnDefaultValues = true
            }
        }
    }
    desktop()
    mingwX64()
    linux()
    mac()
    ios()
    tvos()
    watchos()
    js()
    wasmJs()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain.dependencies {
            api(libs.kotlinCoroutinesCore)
            // The fork does not build runtime-annotation and the prototype does not change it:
            // depend on the release the rest of the androidx.compose redirect points at.
            api("androidx.compose.runtime:runtime-annotation:${project.redirectVersions.get('androidx.compose')}")
            implementation("androidx.collection:collection:1.5.0")
        }

        commonTest.dependencies {
            implementation(libs.kotlinTest)
            implementation(libs.kotlinCoroutinesTest)
            implementation(libs.kotlinReflect)
            implementation(project(":compose:runtime:runtime-test-utils"))
        }

        create("nonEmulatorCommonTest").dependsOn(commonTest)
        create("nonEmulatorJvmTest").dependsOn(nonEmulatorCommonTest)

        create("nonAndroidMain").dependsOn(commonMain)
        create("nonAndroidTest").dependsOn(commonTest)

        desktopMain.dependsOn(nonAndroidMain)

        desktopTest {
            dependsOn(nonEmulatorJvmTest)
            dependsOn(nonAndroidTest)
        }

        nonJvmMain {
            dependsOn(nonAndroidMain)
            dependencies {
                implementation(libs.atomicFu)
            }
        }

        nativeMain.dependsOn(nonAndroidMain)

        nativeTest {
            dependsOn(nonAndroidTest)
            dependsOn(nonEmulatorCommonTest)
        }

        webTest.dependsOn(nonEmulatorCommonTest)

        wasmJsMain.dependencies {
            implementation(libs.kotlinXw3c)
        }
    }
}

androidx {
    name = "Compose Runtime"
    // A redirect-only module never compiles its sources, so upstream dropped this. Building them
    // again re-enables strict explicit-API mode, which the module has never satisfied.
    legacyDisableKotlinStrictApiMode = true
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2019"
    description = "Tree composition support for code generated by the Compose compiler plugin and corresponding public API"
}

// DataSource prototype: advertise the `androidx.compose.runtime:<name>` capability that
// `configureRedirectionCapability()` would add for a redirected module (that helper is currently
// disabled, CMP-10368). The capability is what makes Gradle see a conflict between this project and
// AOSP's androidx.compose.runtime:runtime - which still arrives transitively through every module
// that stays redirected (runtime-saveable, lifecycle, savedstate, ...) - and resolve it in favour of
// the project (JetBrainsCapabilityRule prefers a project reference over any external candidate).
// Without it both jars land on the classpath with the same packages and the DataSource API becomes
// invisible to consumers. Once any explicit capability is declared, the implicit one must be too.
configurations.configureEach { configuration ->
    if (configuration.canBeConsumed) {
        // Qualify with `project.`: inside this closure a bare `name` resolves to the configuration.
        configuration.outgoing.capability("${project.group}:${project.name}:${project.version}")
        configuration.outgoing.capability(
                "androidx.compose.runtime:${project.name}:${project.redirectVersions.get('androidx.compose')}")
    }
}
