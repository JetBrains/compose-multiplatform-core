import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier
import com.android.build.api.dsl.KotlinMultiplatformAndroidHostTestCompilation

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    // Fleet fork: only the Android target is redirected. Every other target is built from source,
    // because this module carries fork-only runtime code (DataSource, SnapshotHolder, NoriaOnly,
    // and the frame-isolation additions to Recomposer/Snapshot/Composition). A redirected target
    // publishes an empty artifact that merely depends on AOSP's androidx.compose.runtime, so none
    // of that would ship. This is the `redirect { }`-era form of the fork's original "stubbing
    // mechanism disabled for the runtime module and related ones in the context of the Noria
    // compatibility work"; the dependency graph below is the one this module had before upstream
    // turned it into a redirect-only module (and therefore stopped declaring any dependencies).
    redirect("androidx.compose.runtime") {
        androidLibrary {
            namespace = "org.jetbrains.compose.runtime"
            compilations.withType(KotlinMultiplatformAndroidHostTestCompilation) {
                it.returnDefaultValues = true
            }
        }
    }
    desktop()
    mingwX64()
    linux()
    mac()
    ios()
    tvos()
    watchos()
    js()
    wasmJs()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain.dependencies {
            api(libs.kotlinCoroutinesCore)
            api(project(":compose:runtime:runtime-annotation"))
            implementation("androidx.collection:collection:1.5.0")
        }

        commonTest.dependencies {
            implementation(libs.kotlinTest)
            implementation(libs.kotlinCoroutinesTest)
            implementation(libs.kotlinReflect)
            implementation(project(":compose:runtime:runtime-test-utils"))
        }

        create("nonEmulatorCommonTest").dependsOn(commonTest)
        create("nonEmulatorJvmTest").dependsOn(nonEmulatorCommonTest)

        create("nonAndroidMain").dependsOn(commonMain)
        create("nonAndroidTest").dependsOn(commonTest)

        desktopMain.dependsOn(nonAndroidMain)

        desktopTest {
            dependsOn(nonEmulatorJvmTest)
            dependsOn(nonAndroidTest)
        }

        nonJvmMain {
            dependsOn(nonAndroidMain)
            dependencies {
                implementation(libs.atomicFu)
            }
        }

        nativeMain.dependsOn(nonAndroidMain)

        nativeTest {
            dependsOn(nonAndroidTest)
            dependsOn(nonEmulatorCommonTest)
        }

        webTest.dependsOn(nonEmulatorCommonTest)

        wasmJsMain.dependencies {
            implementation(libs.kotlinXw3c)
        }
    }
}

androidx {
    name = "Compose Runtime"
    // Carried over from this module's `build.gradle`, which omits it here only because a
    // redirect-only module never compiles its sources. Building them again re-enables strict
    // explicit-API mode, which the module has never satisfied.
    legacyDisableKotlinStrictApiMode = true
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2019"
    description = "Tree composition support for code generated by the Compose compiler plugin and corresponding public API"
}

// Fleet fork: advertise the `androidx.compose.runtime:<name>` capability that
// `configureRedirectionCapability()` would normally add.
//
// That helper only runs when the module has at least one target inside a `redirect { }` block,
// and the capability is what lets Gradle detect a conflict with AOSP's artifact and resolve it in
// the project's favour (JetBrainsCapabilityRule.selectPreferredAndroidXCandidate prefers a project
// reference over any external candidate). Taking the desktop target *out* of the redirect so it
// compiles therefore also removed that capability, and AOSP's
// `androidx.compose.runtime:runtime-desktop` started landing on the classpath next to this project
// — same packages, so the fork-only API (DataSource, SnapshotHolder, NoriaOnly, …) became
// invisible to consumers.
//
// Declaring it explicitly keeps both properties: the target is built from source *and* still wins
// the capability conflict. Note that once any explicit capability is declared, the implicit one
// must be declared too.
configurations.configureEach { configuration ->
    if (configuration.canBeConsumed) {
        // Qualify with `project.` — inside this closure a bare `name` resolves to the
        // configuration, not the project.
        configuration.outgoing.capability("${project.group}:${project.name}:${project.version}")
        configuration.outgoing.capability(
                "androidx.compose.runtime:${project.name}:${project.redirectVersions.get('androidx.compose')}")
        // And the pre-rename fork group: the previously published `org.jetbrains.compose.runtime` artifacts carry the
        // same packages, so claiming their capability is what lets the resolution rule above pick
        // this project over them instead of putting both jars on the classpath.
        configuration.outgoing.capability(
                "org.jetbrains.compose.runtime:${project.name}:${project.version}")
    }
}
