name: Check API
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - jb-main
      - integration

jobs:
  check:
    runs-on: macos-26-xlarge
    name: Check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Prerequisites
        uses: ./.github/actions/setup-prerequisites

      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode

      - name: Public API
        run: |
          ./gradlew jbApiCheck --continue --stacktrace
