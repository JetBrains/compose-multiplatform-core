name: Benchmarks

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  command:
    name: Validate benchmark command
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/run-benchmarks ')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      targets: ${{ steps.command.outputs.targets }}
      tests: ${{ steps.command.outputs.tests }}
      modes: ${{ steps.command.outputs.modes }}
      sha: ${{ steps.command.outputs.sha }}
    steps:
      - name: Parse command and resolve PR revision
        id: command
        uses: actions/github-script@v7
        with:
          script: |
            // Accept space/comma-separated lists, optionally enclosed in square brackets.
            const match = context.payload.comment.body.trim().match(
              /^\/run-benchmarks\s+--target\s+(.+?)\s+--tests\s+(.+?)\s+--modes\s+(.+)$/
            );
            if (!match) {
              throw new Error('Expected: /run-benchmarks --target [...] --tests [...] --modes [...]');
            }
            function parseList(value) {
              const list = value.trim().replace(/^\[([^\[\]]*)\]$/, '$1');
              if (!/^[A-Za-z][A-Za-z0-9-]*(?:[\s,]+[A-Za-z][A-Za-z0-9-]*)*$/.test(list.trim())) {
                throw new Error(`Invalid benchmark list: ${value}`);
              }
              const values = [...new Set(list.trim().split(/[\s,]+/))];
              if (values.includes('all') && values.length !== 1) {
                throw new Error('Use all alone in each list');
              }
              return values;
            }
            const supportedTargets = ['jvm', 'macos', 'js', 'wasmJs', 'ios'];
            const requestedTargets = parseList(match[1]);
            const targets = requestedTargets[0] === 'all' ? supportedTargets : requestedTargets;
            if (targets.some(target => !supportedTargets.includes(target))) {
              throw new Error(`Supported targets: ${supportedTargets.join(', ')}, all`);
            }
            const tests = parseList(match[2]);
            const modes = parseList(match[3]);
            const supportedModes = ['averageFrame', 'fps', 'realFrames', 'startup', 'all'];
            if (modes.some(mode => !supportedModes.includes(mode))) {
              throw new Error(`Supported modes: ${supportedModes.join(', ')}`);
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            if (pr.state !== 'open') {
              throw new Error('Benchmarks can only run for an open PR');
            }
            core.setOutput('targets', JSON.stringify(targets));
            core.setOutput('tests', tests.join(','));
            core.setOutput('modes', modes.join(','));
            core.setOutput('sha', pr.head.sha);

  benchmarks:
    name: Benchmarks (${{ matrix.target }})
    needs: command
    runs-on: macos-26-xlarge
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.command.outputs.targets) }}

    defaults:
      run:
        shell: bash
        working-directory: compose/mpp/benchmarks

    steps:
      - name: Checkout PR revision
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.command.outputs.sha }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR code must not write caches used by trusted workflows.
          cache-read-only: true

      - name: Setup iOS benchmark environment
        if: matrix.target == 'ios'
        id: ios
        uses: ./.github/actions/setup-ios-instrumented-test-environment
        with:
          xcode-path: /Applications/Xcode_26.5.app
          xcode-cache-key-suffix: '26.5'
          simulator-device: iPhone 17
          simulator-os: '26.5'

      - name: Check Chrome
        if: matrix.target == 'js' || matrix.target == 'wasmJs'
        run: '"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version'

      - name: Resolve latest benchmark versions
        uses: ./.github/actions/resolve-benchmark-versions

      - name: Build launcher
        run: ./gradlew :benchmarks-launcher:installDist --console=plain

      - name: Run benchmarks
        env:
          BENCHMARK_TARGET: ${{ matrix.target }}
          BENCHMARK_TESTS: ${{ needs.command.outputs.tests }}
          BENCHMARK_MODES: ${{ needs.command.outputs.modes }}
          SIMULATOR_ID: ${{ steps.ios.outputs.simulator-id }}
          # Use the runner's GPU through ANGLE's Metal backend instead of SwiftShader.
          BENCHMARK_CHROME_ARGUMENTS: '["--use-gl=angle", "--use-angle=metal"]'
        run: |
          args=(--target "$BENCHMARK_TARGET" --tests "$BENCHMARK_TESTS" --modes "$BENCHMARK_MODES")
          case "$BENCHMARK_TARGET" in
            js|wasmJs) args+=(--browser "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome") ;;
            ios) args+=(--simulator "$SIMULATOR_ID") ;;
          esac
          mkdir -p "$RUNNER_TEMP/benchmark-results"
          ./benchmarks-launcher/build/install/benchmarks-launcher/bin/benchmarks-launcher \
            "${args[@]}" \
            --compose-version "$COMPOSE_VERSIONS" \
            --kotlin-version "$KOTLIN_VERSIONS" \
            --compose-core-path "$GITHUB_WORKSPACE" \
            --repeat 3 \
            --output-dir "$RUNNER_TEMP/benchmark-results"

      # GitHub packages the whole session, including index.html, as one ZIP artifact.
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-results/
          if-no-files-found: warn
          retention-days: 30
