name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - benchmarks

permissions:
  contents: read

jobs:
  jvm:
    name: JVM benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash
        working-directory: compose/mpp/benchmarks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Resolve latest versions from Maven Central
        uses: ./.github/actions/resolve-benchmark-versions

      - name: Build launcher
        run: ./gradlew :benchmarks-launcher:installDist --console=plain

      - name: Run JVM benchmarks
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            ./benchmarks-launcher/build/install/benchmarks-launcher/bin/benchmarks-launcher \
            --target jvm \
            --compose-version "$COMPOSE_VERSIONS" \
            --kotlin-version "$KOTLIN_VERSIONS" \
            --compose-core-path "$GITHUB_WORKSPACE" \
            --repeat 3 \
            --output-dir "$RUNNER_TEMP/benchmark-results"

      # GitHub packages the whole session, including index.html, as one ZIP artifact.
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-results/
          if-no-files-found: warn
          retention-days: 30

  web:
    name: Web benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash
        working-directory: compose/mpp/benchmarks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup virtual display and check Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          google-chrome --version

      - name: Resolve latest versions from Maven Central
        uses: ./.github/actions/resolve-benchmark-versions

      - name: Build launcher
        run: ./gradlew :benchmarks-launcher:installDist --console=plain

      - name: Run benchmarks in Chrome
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            ./benchmarks-launcher/build/install/benchmarks-launcher/bin/benchmarks-launcher \
            --target js wasmJs \
            --compose-version "$COMPOSE_VERSIONS" \
            --kotlin-version "$KOTLIN_VERSIONS" \
            --compose-core-path "$GITHUB_WORKSPACE" \
            --browser "$(command -v google-chrome)" \
            --repeat 3 \
            --output-dir "$RUNNER_TEMP/benchmark-results"

      # GitHub packages the whole session, including index.html, as one ZIP artifact.
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-results/
          if-no-files-found: warn
          retention-days: 30

  ios:
    name: iOS benchmarks
    runs-on: macos-26-xlarge
    timeout-minutes: 360

    defaults:
      run:
        shell: bash
        working-directory: compose/mpp/benchmarks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup iOS benchmark environment
        id: ios
        uses: ./.github/actions/setup-ios-instrumented-test-environment
        with:
          xcode-path: /Applications/Xcode_26.5.app
          xcode-cache-key-suffix: '26.5'
          simulator-device: iPhone 17
          simulator-os: '26.5'

      - name: Resolve latest versions from Maven Central
        uses: ./.github/actions/resolve-benchmark-versions

      - name: Build launcher
        run: ./gradlew :benchmarks-launcher:installDist --console=plain

      - name: Run iOS benchmarks
        env:
          SIMULATOR_ID: ${{ steps.ios.outputs.simulator-id }}
        run: |
          ./benchmarks-launcher/build/install/benchmarks-launcher/bin/benchmarks-launcher \
            --target ios \
            --simulator "$SIMULATOR_ID" \
            --compose-version "$COMPOSE_VERSIONS" \
            --kotlin-version "$KOTLIN_VERSIONS" \
            --compose-core-path "$GITHUB_WORKSPACE" \
            --repeat 3 \
            --output-dir "$RUNNER_TEMP/benchmark-results"

      # GitHub packages the whole session, including index.html, as one ZIP artifact.
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-results/
          if-no-files-found: warn
          retention-days: 30
