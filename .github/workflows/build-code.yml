name: Build Code
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - jb-main
      - integration

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      buildCode: ${{ steps.filter.outputs.buildCode }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect build-related changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filter.yml

  sync-project:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.buildCode == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-26-xlarge
            name: macOS
          - os: windows-latest
            name: Windows
    name: Sync Project (${{ matrix.name }})
    steps:
      - name: Enable Long Paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Prerequisites
        uses: ./.github/actions/setup-prerequisites

      - name: Setup Xcode
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-xcode

      - name: Sync Project
        shell: bash
        run: |
          ./gradlew prepareKotlinIdeaImport --no-daemon --stacktrace

  build-src-checks:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.buildCode == 'true'
    runs-on: ubuntu-24.04
    name: buildSrc checks
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Prerequisites
        uses: ./.github/actions/setup-prerequisites

      - name: buildSrc tests
        shell: bash
        run: ./gradlew -p buildSrc :test --continue --stacktrace

      - name: Fork Dependencies
        shell: bash
        run: ./gradlew jbVerifyForkDependencies --continue --stacktrace
