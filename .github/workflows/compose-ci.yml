name: Compose CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - jb-main
      - integration

# Require the `Compose CI / Compose CI` check in repository rulesets. It is a
# stable gate over the selectively-run Compose checks below.
permissions:
  actions: write
  checks: read

jobs:
  compose-ci:
    name: Compose CI
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Start validation for a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v8
        with:
          script: |
            for (const workflow_id of [
              'compose-tests.yml',
              'compose-publish-dry-run.yml',
            ]) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                ref: context.ref,
              });
            }

      - name: Wait for Compose validation
        uses: actions/github-script@v8
        env:
          EXPECTED_CHECKS: >-
            Tests / Desktop|Tests / iOS|Tests / iOS Utils|Tests / iOS Instrumented iOS 18.6 / iPhone 16|Tests / iOS Instrumented iOS 18.6 / iPad Pro 11-inch (M4)|Tests / iOS Instrumented iOS 26.5 / iPhone 17|Tests / iOS Instrumented iOS 26.5 / iPad Pro 11-inch (M5)|Tests / Web Chrome|Tests / Web Firefox|Build / Darwin + Native Linux|Build / Web|Build / JVM
        with:
          script: |
            const expected = process.env.EXPECTED_CHECKS.split('|');
            const passing = new Set(['success', 'skipped', 'neutral']);
            for (let attempt = 0; attempt < 180; attempt++) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                per_page: 100,
              });
              const checks = new Map();
              for (const check of data.check_runs) {
                const previous = checks.get(check.name);
                if (!previous || check.started_at > previous.started_at) {
                  checks.set(check.name, check);
                }
              }
              const missing = expected.filter(name => !checks.has(name));
              const unfinished = expected.filter(name => {
                const check = checks.get(name);
                return check && check.status !== 'completed';
              });

              if (missing.length === 0 && unfinished.length === 0) {
                const failed = expected.filter(name => !passing.has(checks.get(name).conclusion));
                if (failed.length > 0) {
                  core.setFailed(`Compose validation failed: ${failed.join(', ')}`);
                }
                return;
              }

              if (attempt === 179) {
                core.setFailed(`Timed out waiting for: ${[...missing, ...unfinished].join(', ')}`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 30_000));
            }
