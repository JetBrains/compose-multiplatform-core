name: Build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - jb-main
      - integration

env:
  PLATFORM_PATH_FILTERS: |
    ios:
      - '**/iosMain/**'
      - '**/darwinMain/**'
      - '**/nativeMain/**'
      - '**/uikitMain/**'
    
    web:
      - '**/webMain/**'
      - '**/jsMain/**'
      - '**/jsWasmMain/**'
      - '**/wasmJsMain/**'
    
    desktop:
      - '**/jvmMain/**'
      - '**/desktopMain/**'
    
    unknown:
      - '**'
    
      - '!**/iosMain/**'
      - '!**/darwinMain/**'
      - '!**/nativeMain/**'
      - '!**/uikitMain/**'
    
      - '!**/webMain/**'
      - '!**/jsMain/**'
      - '!**/jsWasmMain/**'
      - '!**/wasmJsMain/**'
    
      - '!**/jvmMain/**'
      - '!**/desktopMain/**'

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      unknown: ${{ steps.filter.outputs.unknown }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect affected platforms
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ env.PLATFORM_PATH_FILTERS }}
          predicate-quantifier: some-with-excludes

  compose-native-publish:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ios == 'true' || needs.changes.outputs.unknown == 'true'
    runs-on: macos-26-xlarge
    name: Darwin + Native Linux
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Prerequisites
        uses: ./.github/actions/setup-prerequisites

      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode

      - name: Dry Publish
        run: |
          ./gradlew publishComposeJb -Pcompose.platforms=macos,ios,tvos,watchos,linux,mingw \
            --no-daemon --stacktrace

      - name: Demos
        run: |
          ./gradlew \
            :compose:mpp:demo:linkDebugExecutableMacosArm64 \
            :compose:mpp:demo:linkDebugExecutableIosArm64 \
            :compose:mpp:demo:linkDebugExecutableIosSimArm64 \
            --no-daemon --stacktrace

  compose-web-publish:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' || needs.changes.outputs.unknown == 'true'
    runs-on: ubuntu-24.04
    name: Web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Prerequisites
        uses: ./.github/actions/setup-prerequisites

      - name: Dry Publish
        run: |
          ./gradlew publishComposeJb -Pcompose.platforms=web \
            --no-daemon --stacktrace

      - name: Demos
        run: |
          ./gradlew \
            :compose:mpp:demo:compileKotlinJs \
            :compose:mpp:demo:compileKotlinWasmJs \
            --no-daemon --stacktrace

  compose-jvm-publish:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.unknown == 'true'
    runs-on: ubuntu-24.04
    name: JVM
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Prerequisites
        uses: ./.github/actions/setup-prerequisites

      - name: Dry Publish
        run: |
          ./gradlew publishComposeJb -Pcompose.platforms=jvm,android \
            --no-daemon --stacktrace

      - name: Demos
        run: |
          ./gradlew \
            :compose:mpp:demo:desktopMainClasses \
            :compose:desktop:desktop:desktop-samples:jvmMainClasses \
            --no-daemon --stacktrace
