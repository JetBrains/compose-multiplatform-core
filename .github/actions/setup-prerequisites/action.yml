name: 'Setup Prerequisites'
runs:
  using: "composite"
  steps:
    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'corretto'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
