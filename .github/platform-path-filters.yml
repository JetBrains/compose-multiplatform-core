# Keep platform-specific source sets out of the `unknown` fallback. Shared source
# sets deliberately remain unknown so they continue to exercise every platform.
native:
  - '**/iosMain/**'
  - '**/iosTest/**'

  - '**/darwinMain/**'
  - '**/darwinTest/**'

  - '**/nativeMain/**'
  - '**/nativeTest/**'

  - '**/uikitMain/**'
  - '**/uikitTest/**'
  - '**/uikitInstrumentedTest/**'

  - '**/appleMain/**'
  - '**/appleTest/**'

  - '**/macosMain/**'
  - '**/macosTest/**'

  - '**/tvosMain/**'
  - '**/tvosTest/**'

  - '**/watchosMain/**'
  - '**/watchosTest/**'

  - '**/linuxMain/**'
  - '**/linuxTest/**'

  - '**/mingwMain/**'
  - '**/mingwTest/**'

web:
  - '**/webMain/**'
  - '**/webTest/**'

  - '**/jsMain/**'
  - '**/jsTest/**'

  - '**/jsWasmMain/**'
  - '**/jsWasmTest/**'

  - '**/wasmJsMain/**'
  - '**/wasmJsTest/**'

desktop:
  - '**/jvmMain/**'
  - '**/jvmTest/**'

  - '**/desktopMain/**'
  - '**/desktopTest/**'

unknown:
  - '**'
  - '!**/iosMain/**'
  - '!**/iosTest/**'

  - '!**/darwinMain/**'
  - '!**/darwinTest/**'

  - '!**/nativeMain/**'
  - '!**/nativeTest/**'

  - '!**/uikitMain/**'
