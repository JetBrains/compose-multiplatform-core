void includeRequestedProjectsAndDependencies() {
    Set<String> projectsToInclude = projectDependencyGraph
            .getAllProjectsWithDependencies(filteredProjects)
    projectsToInclude.forEach { path, dir ->
        settings.include(path)
        def project = project(path)
        project.projectDir = dir
        project.buildFileName = ["build-fork.gradle.kts", "build-fork.gradle", "build.gradle.kts", "build.gradle"]
                .find {
                    new File(project.projectDir, it).isFile()
                }
    }
}
